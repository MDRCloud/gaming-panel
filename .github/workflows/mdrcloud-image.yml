name: MDRCloud Image

# Lean build of the branded panel image (x86_64 only) -> ghcr.io/mdrcloud/gaming-panel
# Recipe mirrors upstream build-and-publish.yml; multi-arch, AIO and Docker Hub are intentionally dropped.
on:
  push:
    branches: [mdrcloud]
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: mdrcloud-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/mdrcloud/gaming-panel

jobs:
  image:
    if: github.repository == 'MDRCloud/gaming-panel'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
          run_install: false

      - name: Build frontend
        run: |
          cd frontend
          pnpm install
          pnpm build:ci

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl
          cache: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: x86_64-unknown-linux-musl-panel-rs

      - name: Install cross
        env:
          CARGO_BUILD_WARNINGS: allow
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 8c1a8aa4b661711f4b7b6ac07c2e8929ce2f7d27 --locked

      - name: Build panel binary
        env:
          RUSTFLAGS: "-C target-feature=+crt-static -C llvm-args=-enable-machine-outliner=never"
        run: |
          cross build --release --target x86_64-unknown-linux-musl -p panel-rs
          mkdir -p .docker/amd64
          cp target/x86_64-unknown-linux-musl/release/panel-rs .docker/amd64/panel-rs
          chmod +x .docker/amd64/panel-rs

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
